<!DOCTYPE html>
<html>
<head>
  <title>ShopKart</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Lora:ital,wght@0,400..700;1,400..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <h1>ShopKart</h1>
    <span class="nav-links">
      <span>Home</span>
      <span>Men</span>
      <span>Women</span>
      <span>Kids</span>
    </span>
  </header>

  <div id="sale-banner">
    <div id="sale-banner-content">
      <h2>Big Billion Sale</h2>
      <p>Top brands · Free delivery · Easy Returns</p>
    </div>

    <div id="sale-banner-discount">
        UPTO
        70%
        OFF
    </div>
  </div>

  <div class="products-section">
      <div class="product product-1">
        <span class="discount-banner">
          -30%
        </span>
        <span class="wishlist">
          <img src="Assets/wishlist1.svg" id="wishlist1-icon">
        </span>
        <img src="Assets/1791002268989.png" alt="running-shoes" class="product-image">
        <div class="product-description">
          <p>Running Shoes</p>
          <p class="price">$1,499</p>
          <button class="add-to-cart-btn">Add to cart</button>
          <span class="rating"> <img src="Assets/star.svg" id="star-icon">4.3</span>
        </div>
      </div>
     

      <div class="product product-2">
        <span class="new-banner">
          NEW
        </span>
        <span class="wishlist">
          <img src="Assets/wishlist.svg" id="wishlist-icon">
        </span>
        <img src="Assets/1791002269018.png" alt="smart-watch" class="product-image">
        <div class="product-description">
          <p>Smart Watch</p>
          <p class="price">$2,999</p>
          <button class="add-to-cart-btn">Add to cart</button>
          <span class="rating"> <img src="Assets/star.svg" id="star-icon">4.7</span>
        </div>
      </div>
      
      <div class="product product-3">
        <span class="discount-banner">
          -15%
        </span>
        <span class="wishlist">
          <img src="Assets/wishlist.svg" id="wishlist-icon">
        </span>
        <img src="Assets/1791002268973.png" alt="headphones" class="product-image">
        <div class="product-description">
          <p>Headphones</p>
          <p class="price">$3,499</p>
          <button class="add-to-cart-btn">Add to cart</button>
          <span class="rating"> <img src="Assets/star.svg" id="star-icon">4.1</span>
        </div>
      </div>

      <div class="product product-4">
        <span class="new-banner">
          NEW
        </span>
        <span class="wishlist">
          <img src="Assets/wishlist1.svg" id="wishlist1-icon">
        </span>
        <img src="Assets/1791002268589.png" alt="backpack" class="product-image">
        <div class="product-description">
          <p>Backpack</p>
          <p class="price">$1,199</p>
          <button class="add-to-cart-btn">Add to cart</button>
          <span class="rating"> <img src="Assets/star.svg" id="star-icon">3.9</span>
        </div>
      </div>
  </div>

  <footer>
    © 2026 ShopKart
  </footer>
</body>
</html>
