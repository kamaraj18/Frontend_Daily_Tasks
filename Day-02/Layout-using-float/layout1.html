<!DOCTYPE html>
<html>
<head>
  <title>Layout 1</title>
  <style>
    *{
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }
    .container{
      margin: 100px auto;
      height: 600px;
      width: 25%;
      background-color: red;
      border: 5px solid black;
    }
    #child1{
      height: 60%;
      width: 40%;
      float: left;
      border: 5px solid white;
    }
    #child2{
      width: 60%;
      height: 30%;
      float: left;
      border: 5px solid white;
    }
    #child3{
      width: 30%;
      height: 30%;
      float: right;
      border: 5px solid white;
    }
    #child4{
      width: 30%;
      height: 30%;
      float: right;
      border: 5px solid white;
    }
    #child5{
      width: 100%;
      height: 40%;
      float: left;
      border: 5px solid white;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="child1"></div>
    <div id="child2"></div>
    <div id="child3"></div>
    <div id="child4"></div>
    <div id="child5"></div>
  </div>
</body>
</html>
